services:
    app:
        build: .
        container_name: laravel_app
        restart: unless-stopped
        ports:
            - "5173:5173"
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        environment:
            - DB_HOST=db
            - DB_PORT=3306
            - DB_USERNAME=laravel
            - DB_PASSWORD=laravel
            - APP_URL=http://localhost:8000
            - ELASTICSEARCH_HOSTS=elasticsearch:9200
        depends_on:
            - db
            - elasticsearch
        networks:
            - laravel

    queue:
        build: .
        container_name: laravel_queue
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        environment:
            - DB_HOST=db
            - DB_PORT=3306
            - DB_USERNAME=laravel
            - DB_PASSWORD=laravel
            - APP_URL=http://localhost:8000
            - ELASTICSEARCH_HOSTS=elasticsearch:9200
        command: php artisan queue:work --tries=3 --sleep=3
        depends_on:
            - db
            - elasticsearch
        networks:
            - laravel

    db:
        image: mariadb:latest
        container_name: laravel_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_ROOT_PASSWORD: root
            MYSQL_PASSWORD: laravel
            MYSQL_USER: laravel
        ports:
            - "3306:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - laravel

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        container_name: laravel_elasticsearch
        restart: unless-stopped
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
        ports:
            - "9200:9200"
        volumes:
            - esdata:/usr/share/elasticsearch/data
        networks:
            - laravel
    nginx:
        image: nginx:alpine
        container_name: laravel_nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: laravel_phpmyadmin
        restart: unless-stopped
        environment:
            PMA_HOST: db
            PMA_USER: laravel
            PMA_PASSWORD: laravel
        ports:
            - "8001:80"
        depends_on:
            - db
        networks:
            - laravel

volumes:
    dbdata:
        driver: local
    esdata:
        driver: local

networks:
    laravel:
        driver: bridge
